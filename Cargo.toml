[package]
name = "twinstor"
version = "0.7.1"
edition = "2024"
description = "Replicated shared storage for two-host XCP-ng pools (DRBD 9, LIO iSCSI, multipath)"
license = "GPL-2.0-or-later"
repository = "https://github.com/xcp-ng/twinstor"
readme = "README.md"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
anyhow = "1"
async-trait = "0.1"
hostname = "0.4"
libc = "0.2"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# test-util enables #[tokio::test(start_paused = true)] so timer-heavy paths
# (grace periods, retry sleeps) run instantly in tests instead of in realtime.
tokio = { version = "1", features = ["test-util"] }
